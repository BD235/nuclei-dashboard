services:
  # 1. Target Aplikasi Rentan
  juice-shop:
    image: bkimminich/juice-shop
    container_name: nuclei-target-juiceshop
    ports:
      - "3000:3000"
    restart: unless-stopped

  # 2. FastAPI Backend & Nuclei Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nuclei-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - juice-shop
    restart: unless-stopped

  # 3. Web Server Frontend (Nginx Alpine)
  frontend:
    image: nginx:alpine
    container_name: nuclei-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
